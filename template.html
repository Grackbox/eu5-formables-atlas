    .sort((a, b) => (a.xc ? 1 : 0) - (b.xc ? 1 : 0) || a.level - b.level || a.name.localeCompare(b.name))
    .map(f => ({ id: f.id, label: f.name + (f.variant ? ` · ${t.variant} ${f.variant}` : ""),
      b: t.tierN(f.level) + (f.xc ? ` · ${t.xcBadge}` : ""), title: f.xc ? t.xcHint : "" }));
  const st = c.st.map(nationLink).filter(x => x.id);
  d.innerHTML = `
    <div class="dhead"><span class="sw" style="background:${c.color || "transparent"}"></span><h2 id="dtitle">${esc(c.name)}</h2>
      <span class="tag">${esc(c.key)}</span>${backBtn()}<button class="close" type="button" id="close">${esc(t.close)}</button></div>
    <p class="small"><span class="muted">${esc(t.groupsL)}:</span> ${c.gk.map((g, n) => `<button type="button" class="linkchip" data-open="grp.${esc(g)}">${esc(c.groups[n])}</button>`).join(" ") || "—"}
      · <span class="muted">${esc(t.langL)}:</span> ${c.lang ? `<button type="button" class="linkchip" data-lang="${esc(c.lang)}">${esc(c.lang)}</button>` : "—"}${c.dia ? ` <span class="muted">(${esc(c.dia.toLowerCase())})</span>` : ""}</p>
    <div class="cards">
      ${advances({ adv: c.advObjs, tag: "", name: c.name }, t.cadvTitle(c.advObjs.length), t.cadvNote)}
      <div class="card wide"><h3>${esc(t.formsTitle(forms.length))}</h3>${forms.length ? linkChips(forms) : `<div class="muted">${esc(t.formsNone)}</div>`}<div class="muted small">${esc(t.formsAny(items.filter(f => f.cul == null).length))}</div></div>
      <div class="card wide"><h3>${esc(t.startTitle(st.length))}</h3>${st.length ? linkChips(st) : `<div class="muted">${esc(t.startNone)}</div>`}</div>
    </div>`;
  d.classList.add("open"); $("#backdrop").hidden = false; d.scrollTop = 0;
  $("#close").onclick = closeDetail;
  if (push) nav(c.id);
  render();
  $("#close").focus({ preventScroll: true });
}

function advances(i, title, note) {
  const t = u();
  if (!i.adv.length) return "";
  const byAge = {};
  for (const a of i.adv) (byAge[a.age] ||= []).push(a);
  return `<div class="card wide"><h3>${esc(title || t.advTitle(i.tag, i.adv.length))}</h3><div class="muted small">${esc(note || t.advNote(i.name))}</div>` +
    Object.keys(byAge).sort((a, b) => a - b).map(age => `<div class="age"><span class="roman">${ROMAN[age] || age}</span>${esc(UI[lang] ? t.age(byAge[age][0].ageN) : byAge[age][0].ageN)}</div>` +
      byAge[age].map(a => `<div class="adv">
        <div><div class="an">${esc(a.n)}${(a.gk || []).map((g, n) => `<button type="button" class="grpbadge" data-open="grp.${esc(g)}">${esc(t.grpBadge(a.grp[n]))}</button>`).join("")}${(a.rgk || []).map((g, n) => `<button type="button" class="grpbadge" data-open="rgr.${esc(g)}">${esc(t.grpBadge(a.rgrp[n]))}</button>`).join("")}</div>
          <div class="ab">${a.b.map(b => `<span class="b">${esc(b)}</span>`).join("")}${a.u.map(x => unlockHtml(x)).join("")}</div></div>
        <div class="side"><div>${a.req.length ? `${esc(t.requires)}: ${a.req.map(esc).join(", ")}` : ""}${a.req.length && a.d ? " · " : ""}${a.d ? `<button type="button" class="dbtn" aria-expanded="false">${esc(t.descr)}</button>` : ""}</div>
          ${a.cond.length === 1 && !a.cond[0].c ? `<div class="${a.cond[0].k === "orig" ? "orig" : ""}">${esc(t.extra)} ${esc(a.cond[0].t)}</div>` : a.cond.length ? `<div>${esc(t.extra)}</div>${tree(a.cond)}` : ""}</div>
        ${a.d ? `<div class="ad" hidden>${esc(a.d)}</div>` : ""}</div>`).join("")).join("") + `</div>`;
}

function geoRow(label, text, key) {
  if (!text) return "";
  if (!key || !DATA.geo || !DATA.geo[key]) return `<div><span class="muted">${esc(label)}:</span> ${esc(text)}</div>`;
  const g = DATA.geo[key], t = u();
  const extra = g.n !== text ? `<b>${esc((t.geoLv[g.lv] || "").toLowerCase())} ${esc(g.n)}</b>` : "";
  return `<div><span class="muted">${esc(label)}:</span> <button type="button" class="linkchip" data-open="geo.${esc(key)}">${esc(text)}${extra}</button></div>`;
}
function contCell(i) {
  return i.contk && DATA.geo && DATA.geo[i.contk] ? `<button type="button" class="cellbtn" data-open="geo.${esc(i.contk)}">${esc(i.cont)}</button>` : esc(i.cont);
}

function openFixed(i, push) {
  const t = u(), d = $("#drawer");
  const row = (k, v) => v ? `<div><span class="muted">${esc(k)}:</span> ${esc(v)}</div>` : "";
  d.innerHTML = `
    <div class="dhead"><span class="sw" style="background:${i.color || "transparent"}"></span><h2 id="dtitle">${esc(i.name)}</h2>
      <span class="tag">${esc(i.tag)}</span>${i.rank ? `<span class="rule">${esc(i.rank)}</span>` : ""}
      ${backBtn()}<button class="close" type="button" id="close">${esc(t.close)}</button></div>
    <p class="gilt" style="white-space:normal">${esc(t.fixedNote)}</p>
    ${i.twin ? `<p class="small">${esc(t.twinFixedNote(i.twin.name, i.twin.tag))} <button type="button" class="dbtn" data-open="${esc(i.twin.id)}">${esc(t.twinOpen)}</button></p>` : ""}
    <div class="cards">
      ${advances(i)}
      ${principles(i)}
      <div class="card"><h3>${esc(t.infoTitle)}</h3>${geoRow(t.capital, i.cap, i.capk)}${i.ck && DATA.culByKey[i.ck] ? `<div><span class="muted">${esc(t.culture)}:</span> <button type="button" class="linkchip" data-open="cul.${esc(i.ck)}">${esc(i.cul)}</button></div>` : row(t.culture, i.cul)}${i.rk && DATA.relByKey[i.rk] ? `<div><span class="muted">${esc(t.religion)}:</span> <button type="button" class="linkchip" data-open="rel.${esc(i.rk)}">${esc(i.rel)}</button></div>` : row(t.religion, i.rel)}${geoRow(t.continent, i.cont, i.contk)}${row(t.locsStart, String(i.locs))}</div>
    </div>`;
  d.classList.add("open"); $("#backdrop").hidden = false; d.scrollTop = 0;
  $("#close").onclick = closeDetail;
  if (push) nav(i.id);
  render();
  $("#close").focus({ preventScroll: true });
}

// a link from a card into another list: that list starts unfiltered, so the opened row is always in it
function switchList(m) {
  state.mode = m; state.q = ""; state.cont = ""; state.clang = ""; state.tiers.clear(); state.rules.clear();
  FLAGS.forEach(f => { state[f] = false; $("#" + f).checked = false; });
  $("#q").value = ""; $("#cont").value = "";
  document.querySelectorAll("#tiers .chip, #rules .chip").forEach(c => c.setAttribute("aria-pressed", "false"));
  paintChrome();
}
function openDetail(id, push = true) {
  const t = u();
  const i = items.find(x => x.id === id), d = $("#drawer");
  if (id.startsWith("rgr.") && DATA.rgrByKey[id.slice(4)]) {
    if (!relMode()) { switchList("r"); render(); }
    state.sel = null; openRGroup(DATA.rgrByKey[id.slice(4)], push); return;
  }
  if (id.startsWith("rel.") && DATA.relByKey[id.slice(4)]) {
    state.sel = id; if (!relMode()) { switchList("r"); }
    openReligion(DATA.relByKey[id.slice(4)], push); return;
  }
  if (id.startsWith("geo.") && DATA.geo && DATA.geo[id.slice(4)]) { state.sel = null; openGeo(id.slice(4), push); return; }
  if (id.startsWith("grp.")) {
    const g = DATA.grpByKey[id.slice(4)];
    if (g) { if (!cultMode()) { switchList("c"); render(); } state.sel = null; openGroup(g, push); return; }
  }
  const cu = !i && (DATA.cultures || []).find(x => x.id === id);
  if (cu) { state.sel = id; if (!cultMode()) { switchList("c"); } openCulture(cu, push); return; }
  const fx = !i && (DATA.fixed || []).find(x => x.id === id);
  if (fx) { state.sel = id; if (!fixedMode()) { switchList("x"); } openFixed(fx, push); return; }
  if (i && state.mode !== "f") { switchList("f"); }
  if (!i) { closeDetail(); return; }
  state.sel = id;
  const pct = Math.round(i.frac * 100);
  const terr = Object.entries(i.terr).map(([lab, list]) => `<h4>${esc(lab)}</h4>${list.map(e => e.k && DATA.geo && DATA.geo[e.k] ? `<button type="button" class="pill pillbtn" data-open="geo.${esc(e.k)}">${esc(e.n)}<b>${e.c}</b></button>` : `<span class="pill">${esc(e.n)}<b>${e.c}</b></span>`).join("")}`).join("");
  const ranks = i.ranks.map(r => DATA.ranks[r]).filter(Boolean).map(r =>
    `<div class="card"><h3>${esc(t.rankBonus(r.name))}</h3><ul class="tree">${r.mods.map(m => `<li class="k-good"><span>${esc(m)}</span></li>`).join("")}</ul></div>`).join("");
  d.innerHTML = `
    <div class="dhead"><span class="sw" style="background:${i.color || "transparent"}"></span><h2 id="dtitle">${esc(i.name)}</h2>
      <span class="tag">${esc(i.tag)} · ${esc(i.id)}</span><span class="tier t${i.level}">${esc(t.tierN(i.level))}</span>
      <span class="rule">${esc(t.rules[i.rule] || i.rule)}</span>${backBtn()}<button class="close" type="button" id="close">${esc(t.close)}</button></div>
    ${i.start ? `<p class="muted small">${esc(t.startNote)} ${esc(t.startTier(i.level))}</p>` : ""}
    ${i.twinFixed ? `<p class="small">${esc(t.twinFormNote(i.twinFixed.tag))} <button type="button" class="dbtn" data-open="${esc(i.twinFixed.id)}">${esc(t.twinOpen)}</button></p>` : ""}
    ${i.desc ? `<p class="desc clamp" title="${esc(t.descr)}">${esc(i.desc)}</p>` : ""}
    <div class="cards">
      ${advances(i)}
      ${principles(i)}
      ${cultureCard(i)}
      ${religionCard(i)}
      <div class="card terr"><h3>${esc(t.terrTitle)}</h3>
        ${i.event ? `<div class="gilt" style="white-space:normal">${esc(t.eventNote)}</div>` : `<div>${t.needOwn(pct, i.need, i.total)}</div><div class="meter"><i style="width:${pct}%"></i></div>`}
        ${i.event ? "" : i.cap ? `<div class="muted small">${esc(t.capReq)}</div>` : `<div class="gilt">${esc(t.capFree)}</div>`}
        ${!i.own ? `<div class="muted small">${esc(t.ownNo)}</div>` : ""}
        ${terr || (i.event ? "" : `<div class="muted">${esc(t.noTerr)}</div>`)}</div>
      <div class="card"><h3>${esc(t.potTitle)}</h3>${tree(i.pot) || `<div class="muted">${esc(t.potNone)}</div>`}</div>
      <div class="card"><h3>${esc(t.allowTitle)}</h3>${tree(i.allow) || `<div class="muted">${esc(t.allowNone)}</div>`}</div>
      <div class="card"><h3>${esc(t.effTitle)}</h3>${tree(i.eff) || `<div class="muted">${esc(t.effNone)}</div>`}</div>
      ${ranks}
    </div>`;
  d.classList.add("open"); $("#backdrop").hidden = false; d.scrollTop = 0;
  $("#close").onclick = closeDetail;
  if (push) nav(id);
  render();
  $("#close").focus({ preventScroll: true });
}
function backBtn() {
  // shown only when there is a step inside the site to go back to
  const can = history.state && history.state.d > 0;
  return can ? `<button class="dback" type="button" id="dback" title="${esc(u().back)}" aria-label="${esc(u().back)}">↶</button>` : "";
}
const tabHash = () => state.mode === "f" ? "" : "tab." + state.mode;
function nav(h) {
  // one history entry per card or list, so the browser's back and forward buttons walk through them
  if (decodeURIComponent(location.hash.slice(1)) === h) return;
  try { history.pushState({ d: ((history.state && history.state.d) || 0) + 1 }, "", h ? "#" + h : location.pathname + location.search); } catch {}
}
function closeDetail(fromHistory = false) {
  $("#drawer").classList.remove("open"); $("#backdrop").hidden = true;
  const was = state.sel; state.sel = null;
  if (fromHistory !== true) nav(tabHash());
  render();
  if (was) document.querySelector(`tr[data-id="${CSS.escape(was)}"]`)?.focus({ preventScroll: true });
}

async function setLang(l) {
  lang = l; store.set("eu5f-lang", l); $("#lang").value = l;
  paintChrome();
  $("#loading").hidden = false;
  try {
    DATA = await loadLang(l);
    prepare();
    $("#loading").hidden = true;
    paintChrome(); render();
    if (state.sel) openDetail(state.sel, false);
  } catch (e) {
    $("#loading").textContent = u().loadFail;
  }
}

$("#lang").innerHTML = Object.entries(LANGS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
$("#lang").addEventListener("change", e => setLang(e.target.value));
$("#tiers").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; const v = +b.dataset.v;
  state.tiers.has(v) ? state.tiers.delete(v) : state.tiers.add(v); b.setAttribute("aria-pressed", state.tiers.has(v)); render(); });
$("#rules").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; const v = b.dataset.v;
  state.rules.has(v) ? state.rules.delete(v) : state.rules.add(v); b.setAttribute("aria-pressed", state.rules.has(v)); render(); });
$("#rows").addEventListener("click", e => {
  const o = e.target.closest("[data-open]"); if (o) { openDetail(o.dataset.open); return; }
  const l = e.target.closest("[data-lang]"); if (l) { filterLang(l.dataset.lang); return; }
  const tr = e.target.closest("tr"); if (tr) openDetail(tr.dataset.id);
});
$("#count").addEventListener("click", e => { if (e.target.closest("#clearLang")) { state.clang = ""; render(); } });
function filterLang(name) {
  if (state.sel) closeDetail();
  if (!cultMode()) { switchList("c"); }
  state.clang = name; render();
}
function filterGroup(name) {
  if (state.sel) closeDetail();
  if (!cultMode()) { state.mode = "c"; paintChrome(); }
  state.cont = name; state.clang = ""; paintChrome(); render();
}
$("#rows").addEventListener("keydown", e => { if (e.key === "Enter") { const tr = e.target.closest("tr"); if (tr) openDetail(tr.dataset.id); } });
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#cont").addEventListener("change", e => { state.cont = e.target.value; render(); });
$("#sort").addEventListener("change", e => { setSort(e.target.value); render(); });
function setMode(m, fromHistory = false) {
  if (m === state.mode) return;
  state.mode = m; state.cont = ""; state.clang = ""; $("#cont").value = "";
  if (state.sel) closeDetail(true);
  paintChrome(); render();
  if (!fromHistory) nav(tabHash());
}
window.addEventListener("popstate", () => {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h || h.startsWith("tab.")) {
    if (state.sel || !$("#backdrop").hidden) closeDetail(true);
    setMode(h ? h.slice(4) : "f", true);
  } else openDetail(h, false);
});
$("#other").addEventListener("click", e => { const b = e.target.closest("[data-mode]"); if (b) setMode(b.dataset.mode); });
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-mode]"); if (b) setMode(b.dataset.mode); });
const FLAGS = ["fRank", "fEff", "fCap", "fAllow", "fAdv", "fNoEvent"];
for (const f of FLAGS) $("#" + f).addEventListener("change", e => { state[f] = e.target.checked; render(); });
document.querySelectorAll("th").forEach(th => th.addEventListener("click", () => {
  const k = th.dataset.k, [ck, cd] = sortKey().split(":");
  const desc = ["level", "rank", "nadv", "rankLevel", "locs", "nforms", "nst"].includes(k);  // numbers sort high-first
  setSort(`${k}:${ck === k ? (cd === "asc" ? "desc" : "asc") : (desc ? "desc" : "asc")}`);
  $("#sort").value = sortKey();
  render();
}));
$("#reset").addEventListener("click", () => {
  state.q = ""; state.tiers.clear(); state.rules.clear(); state.cont = ""; state.clang = "";
  FLAGS.forEach(f => { state[f] = false; $("#" + f).checked = false; });
  $("#q").value = ""; $("#cont").value = "";
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false"));
  render();
});
$("#backdrop").addEventListener("click", closeDetail);
$("#drawer").addEventListener("click", e => {
  if (e.target.closest("#dback")) { history.back(); return; }
  const o = e.target.closest("[data-open]");
  if (o) { openDetail(o.dataset.open); return; }
  const l = e.target.closest("[data-lang]");
  if (l) { filterLang(l.dataset.lang); return; }
  const fr = e.target.closest("[data-filter-rgroup]");
  if (fr) { if (state.sel) closeDetail(); if (!relMode()) setMode("r"); state.cont = fr.dataset.filterRgroup; paintChrome(); render(); closeDetail(); return; }
  const fg = e.target.closest("[data-filter-group]");
  if (fg) { filterGroup(fg.dataset.filterGroup); return; }
  const b = e.target.closest(".dbtn");
  if (b) {
    const box = b.closest(".adv").querySelector(".ad");
    box.hidden = !box.hidden; b.setAttribute("aria-expanded", String(!box.hidden));
    return;
  }
  const p = e.target.closest(".desc");
  if (p) p.classList.toggle("clamp");
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.sel) closeDetail(); });
const root = document.documentElement;
const savedTheme = store.get("eu5f-theme");
if (savedTheme === "dark" || savedTheme === "light") root.dataset.theme = savedTheme;
$("#theme").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; store.set("eu5f-theme", root.dataset.theme);
});
{
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("tab.") && ["x", "c", "r"].includes(h.slice(4))) state.mode = h.slice(4);
  else if (h) state.sel = h;
}
setLang(lang);
</script>
